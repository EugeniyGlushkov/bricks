plugins {
    //Java project
    id 'java'
    //support IDE
    id 'idea'
    //чтобы управлять зависимостями
    id 'io.spring.dependency-management' version '1.1.7'
    //чтобы собирать uber (толстый) jar-ник
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    //id 'org.springframework.boot' version '2.6.9'
    id 'groovy'
    id 'war'
}

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

group = 'ru.bricks'
version = '1.0-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

idea {
    project {
        languageLevel = 21
    }
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.7'
    }
}

//numbers of versions
ext {
    logbackVersion = '1.4.9'
    slf4jVersion = '2.0.7'
    springBootVersion = '3.5.7'
}

dependencies {
    //logging
    //implementation group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
    //implementation group: 'ch.qos.logback', name: 'logback-core', version: logbackVersion
    //implementation group: 'org.slf4j', name : 'slf4j-api', version: slf4jVersion
    //implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4jVersion
    implementation group: 'org.codehaus.groovy', name: 'groovy', version: '2.4.15'
    implementation "org.springframework.boot:spring-boot-starter-batch"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-actuator'
    implementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-test"
    implementation "com.google.guava:guava:12.0"
    compileOnly 'org.projectlombok:lombok:1.18.30'
    implementation 'junit:junit'
    implementation 'org.mockito:mockito-core'
    implementation 'org.springframework:spring-test'
    implementation 'javax.persistence:javax.persistence-api:2.2'
    implementation 'org.seleniumhq.selenium:selenium-java'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'com.querydsl:querydsl-core:5.1.0'
    runtimeOnly("org.postgresql:postgresql")
    annotationProcessor(
            "org.springframework.boot:spring-boot-starter-data-jpa",
            //"com.querydsl:querydsl-apt:5.0.0:jpa",
            "javax.annotation:javax.annotation-api:1.3.2",
            "com.querydsl:querydsl-apt:5.1.0:jakarta",
            "org.projectlombok:lombok:1.18.30"
    )
}

apply plugin: 'java-library'