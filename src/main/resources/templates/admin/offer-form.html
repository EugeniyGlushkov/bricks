<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование предложения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <header class="mb-4 pb-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
        <a th:href="@{/}" class="link-primary text-decoration-none fw-medium">← Главная</a>
        <a th:href="@{/admin}" class="link-primary text-decoration-none fw-medium">← Панель администратора</a>
        <div class="user-info d-flex align-items-center gap-3 text-secondary" sec:authorize="isAuthenticated()">
            <span>👤 <span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link p-0 text-primary fw-medium text-decoration-none">Выйти</button>
            </form>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title h4 mb-4"
                            th:text="${isEdit} ? '✏️ Редактировать предложение' : '➕ Новое предложение'">
                            Заголовок
                        </h2>

                        <form th:action="@{/admin/offers/save}" th:object="${form}" method="post">
                            <!-- Hidden fields -->
                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{elementId}">
                            <input type="hidden" th:field="*{partId}">

                            <!-- State -->
                            <div class="mb-3">
                                <label for="state" class="form-label">Состояние <span class="text-danger">*</span></label>

                                <!-- Режим редактирования: только чтение -->
                                <input type="text" id="state" th:field="*{state}" readonly
                                       th:if="${isEdit}" class="form-control">

                                <!-- Режим создания: выпадающий список -->
                                <select id="state" th:field="*{state}"
                                        th:if="${!isEdit}"
                                        th:class="${#fields.hasErrors('state')} ? 'form-select is-invalid' : 'form-select'">
                                    <option value="" disabled selected>Выберите состояние</option>
                                    <option th:each="s : ${availableStates}" th:value="${s}" th:text="${s}">State</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}">Ошибка</div>
                            </div>

                            <!-- Count -->
                            <div class="mb-3">
                                <label for="count" class="form-label">Остаток <span class="text-danger">*</span></label>
                                <input type="number" id="count" th:field="*{count}" min="0"
                                       th:class="${#fields.hasErrors('count')} ? 'form-control is-invalid' : 'form-control'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('count')}" th:errors="*{count}">Ошибка</div>
                            </div>

                            <!-- Price -->
                            <div class="mb-3">
                                <label for="price" class="form-label">Цена</label>
                                <input type="number" step="0.01" id="price" th:field="*{price}" min="0.01"
                                       th:class="${#fields.hasErrors('price')} ? 'form-control is-invalid' : 'form-control'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Ошибка</div>
                            </div>

                            <!-- PriceKuboka -->
                            <div class="mb-3">
                                <label for="priceKuboka" class="form-label">Цена (Кубока)</label>
                                <input type="number" step="0.01" id="priceKuboka" th:field="*{priceKuboka}" min="0.01"
                                       th:class="${#fields.hasErrors('priceKuboka')} ? 'form-control is-invalid' : 'form-control'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('priceKuboka')}" th:errors="*{priceKuboka}">Ошибка</div>
                            </div>

                            <!-- Actions -->
                            <div class="d-flex gap-2 pt-3">
                                <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                                <a th:href="@{/admin/parts/{partId}/offers(partId=${form.partId})}"
                                   class="btn btn-secondary">✕ Отмена</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        document.querySelectorAll('input:not([readonly]), select').forEach(input => {
            input.addEventListener('focus', function () {
                this.classList.remove('is-invalid');
            });
        });
    </script>
</body>
</html>
