<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёты — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <header>
        <a th:href="@{/}">← Главная</a>
        <a th:href="@{/admin}">← Панель администратора</a>
        <div class="user-info" sec:authorize="isAuthenticated()">
            <span>👤 <span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Выйти</button>
            </form>
        </div>
    </header>

    <main class="dashboard">
        <h1 class="mb-4">📊 Отчёты</h1>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Отчёт по предложениям деталей</h5>
                <p class="card-text text-muted">Экспорт деталей с ценами, остатками и изображениями в формате .xlsx</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reportModal">
                    Сформировать отчёт
                </button>
            </div>
        </div>
    </main>

    <!-- Модалка Bootstrap -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Параметры отчёта</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Категории -->
                    <div class="mb-3">
                        <label class="form-label fw-medium">Категории *</label>
                        <div class="dropdown w-100">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" id="catDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                                Выбрать категории...
                            </button>
                            <ul class="dropdown-menu w-100 p-2 custom-dropdown-menu" aria-labelledby="catDropdownBtn">
                                <li class="dropdown-item border-bottom pb-2 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="selectAllCats">
                                        <label class="form-check-label fw-bold" for="selectAllCats">Выбрать все</label>
                                    </div>
                                </li>
                                <li th:each="cat : ${categories}">
                                    <div class="form-check dropdown-item">
                                        <input class="form-check-input cat-checkbox" type="checkbox" th:value="${cat.id}" th:id="'cat-' + ${cat.id}">
                                        <label class="form-check-label" th:for="'cat-' + ${cat.id}" th:text="${cat.name}">Cat</label>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- Состояния -->
                    <div class="mb-3">
                        <label class="form-label fw-medium">Состояния</label>
                        <div class="row g-2">
                            <div th:each="state : ${states}" class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input state-checkbox" type="checkbox" th:value="${state}" th:id="'state-' + ${state}">
                                    <label class="form-check-label" th:for="'state-' + ${state}" th:text="${state}">NEW</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Флаги -->
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="onlyWithPrice">
                            <label class="form-check-label" for="onlyWithPrice">Только с ценой</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="onlyInStock">
                            <label class="form-check-label" for="onlyInStock">Только в наличии</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="generateBtn">
                        Сформировать
                        <span class="spinner-border spinner-border-sm d-none ms-2" id="spinner" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/part_report.js}"></script>
</body>
</html>
