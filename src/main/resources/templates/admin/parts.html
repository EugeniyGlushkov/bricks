<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка: Детали</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        th, td {
            padding: 0.75rem;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .pagination {
            margin: 1rem 0;
        }

        .pagination a, .pagination span {
            margin: 0 0.25rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid #ccc;
            text-decoration: none;
            color: #333;
        }

        .pagination .active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .search-form {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-form input {
            padding: 0.5rem;
            width: 300px;
        }

        img.thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <h1>Управление деталями</h1>

    <form class="search-form" method="get" th:action="@{/admin/parts}">
        <input type="text" name="search" placeholder="Поиск по номеру или названию..." th:value="${search}">
        <button type="submit">Найти</button>
        <a th:href="@{/admin/parts}" style="color:#666">Сбросить</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>Изображение</th>
            <th>Номер</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="part : ${parts.content}">
            <td>
                <img th:if="${part.imageUrl}" th:src="${part.imageUrl}" class="thumb" alt="img">
                <span th:unless="${part.imageUrl}" style="color:#999">—</span>
            </td>
            <td>
                <a th:href="@{/admin/parts/{id}/offers(id=${part.id})}" th:text="${part.partNum}">partNum</a>
            </td>
            <td th:text="${part.name} ?: '—'">name</td>
            <td th:text="${part.categoryId} ?: '—'">catId</td>
            <td>
                <a th:href="@{/admin/parts/{id}/offers(id=${part.id})}">Предложения</a>
            </td>
        </tr>
        <tr th:if="${parts.empty}">
            <td colspan="5" class="empty">Ничего не найдено</td>
        </tr>
        </tbody>
    </table>

    <!-- Пагинация -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/parts(search=${search}, page=${currentPage - 1}, size=${pageSize})}">« Назад</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:if="${i == currentPage}" class="active" href="#">[[${i + 1}]]</a>
            <a th:unless="${i == currentPage}"
               th:href="@{/admin/parts(search=${search}, page=${i}, size=${pageSize})}">[[${i + 1}]]</a>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/parts(search=${search}, page=${currentPage + 1}, size=${pageSize})}">Вперёд »</a>
    </div>

    <p style="margin-top: 1rem; color: #666; font-size: 0.9em;">
        Страница [[${currentPage + 1}]] из [[${totalPages}]] | Всего: [[${parts.totalElements}]]
    </p>
</body>
</html>
