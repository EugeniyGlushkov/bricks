<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <header class="public-header container">
        <a th:href="@{/}" class="link-primary text-decoration-none fw-medium">Briks</a>

        <div class="auth-info">
            <!-- Админ-ссылка (только для ADMIN) -->
            <a th:href="@{/admin}"
               sec:authorize="hasRole('ADMIN')"
               class="link-primary text-decoration-none fw-medium">
                ⚙️ Админ-панель
            </a>

            <!-- Авторизован -->
            <span sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                👤 <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="p-0 border-0 bg-transparent text-primary fw-medium text-decoration-none">Выйти</button>
                </form>
            </span>

            <!-- Не авторизован -->
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="link-primary text-decoration-none fw-medium">Войти</a>
            </span>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Добро пожаловать в Briks</h1>
            <p>Магазин деталей LEGO. Скелет приложения работает.</p>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-primary">
                Перейти в админ-панель →
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
