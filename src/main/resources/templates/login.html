<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h2>Вход в систему</h2>
<form th:action="@{/login}" method="post">
    <label>Логин: <input type="text" name="username" required></label><br>
    <label>Пароль: <input type="password" name="password" required></label><br><br>
    <button type="submit">Войти</button>
</form>
<p th:if="${param.error}" style="color: red;">Неверный логин или пароль</p>
<p th:if="${param.logout}" style="color: green;">Вы вышли из системы</p>
<br><a th:href="@{/}">← На главную</a>
</body>
</html>
