<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="card error-card shadow-sm">
            <div class="card-body text-center">
                <h1 class="error-status"
                    th:classappend="${status == 403} ? 'error-status-403' :
                                      ${status == 404} ? 'error-status-404' :
                                      ${status == 500} ? 'error-status-500' : ''"
                    th:text="${status} ?: 'Ошибка'">
                    Статус
                </h1>

                <p class="error-message mt-4" th:switch="${status}">
                    <span th:case="403">
                        🔒 Доступ запрещён.<br>
                        <span class="d-block mt-1 text-secondary">У вас недостаточно прав для просмотра этой страницы.</span>
                    </span>
                    <span th:case="404">
                        🔍 Страница не найдена.<br>
                        <span class="d-block mt-1 text-secondary">Возможно, ссылка устарела или была введена неверно.</span>
                    </span>
                    <span th:case="500">
                        ⚠️ Внутренняя ошибка сервера.<br>
                        <span class="d-block mt-1 text-secondary">Мы уже работаем над исправлением. Попробуйте позже.</span>
                    </span>
                    <span th:case="*" th:text="${error} ?: 'Произошла непредвиденная ошибка'"></span>
                </p>

                <a th:href="@{/}" class="btn btn-outline-primary mt-3">← Вернуться на главную</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
