app:
  images:
    path: ${IMAGES_PATH:D:\lego\images}

server:
  port: 8080

spring:
  config:
    import:
      - "classpath:downloadPrices.yml"
  datasource:
    url: jdbc:postgresql://localhost:5432/briks_dev
    username: postgres
    # ⚠️ Для prod использовать Secrets / Env vars, не хранить в репозитории
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate # Схемой управляет только Liquibase
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  #TODO Dev-аутентификация (в БД перейдём в Фазе 2)
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

logging:
  level:
    ru.briks: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO